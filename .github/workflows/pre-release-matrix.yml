name: Pre-release matrix

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  pre_release_validate:
    name: Pre-release (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
        node-version: ['24', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Greenfield tests
        run: npx jest tests/greenfield --silent

      - name: Test
        run: npm test

      - name: Verify
        run: npm run verify

      - name: CLI version
        run: node dist/cli.js --version

      - name: CLI help
        run: node dist/cli.js --help

      - name: Package dry-run
        run: npm pack --dry-run
